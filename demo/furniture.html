<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form & Frame — Modern Furniture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec;--bg2:#eae6df;--dark:#1a1612;--dark2:#2c2820;
  --oak:#b8894a;--oak2:#d4a960;--oakdark:#7a5a28;
  --stone:#8a8480;--stonel:#b4b0ac;
  --cream:#fdf8f2;--text:#6a6460;--textd:#3a3530;
  --border:rgba(26,22,18,.1);--borderl:rgba(26,22,18,.06);
  --white:#ffffff;--accent:#c9803a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--dark);font-family:'DM Sans',sans-serif;font-weight:400;display:flex;flex-direction:column}

/* NAV */
nav{height:60px;display:flex;align-items:center;padding:0 40px;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--cream);z-index:20}
.nav-brand{font-family:'Instrument Serif',serif;font-size:1.3rem;font-weight:400;color:var(--dark);text-decoration:none;letter-spacing:.04em}
.nav-brand span{color:var(--accent)}
.nav-links{display:flex;gap:32px}
.nav-link{font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--text);text-decoration:none;transition:color .3s}
.nav-link:hover{color:var(--dark)}
.nav-back{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text);text-decoration:none;transition:color .3s;padding-left:16px;border-left:1px solid var(--border)}
.nav-back:hover{color:var(--dark)}
.nav-cart{padding:8px 22px;background:var(--dark);color:var(--cream);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .3s}
.nav-cart:hover{background:var(--oakdark)}

/* MAIN */
.main{flex:1;display:flex;overflow:hidden}

/* LEFT — PRODUCT LIST */
.list-panel{width:240px;flex-shrink:0;border-right:1px solid var(--border);background:var(--cream);overflow-y:auto;display:flex;flex-direction:column}
.list-panel::-webkit-scrollbar{width:3px}
.list-panel::-webkit-scrollbar-thumb{background:var(--border)}
.lp-header{padding:16px 18px 12px;border-bottom:1px solid var(--borderl);flex-shrink:0}
.lp-title{font-size:9px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--text);margin-bottom:8px}
.lp-filters{display:flex;gap:4px;flex-wrap:wrap}
.lf{padding:4px 10px;border:1px solid var(--border);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text);cursor:pointer;background:transparent;font-family:'DM Sans',sans-serif;transition:all .2s}
.lf.active{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.lf:hover:not(.active){border-color:var(--dark)}
.list-items{padding:10px;overflow-y:auto;flex:1}
.furn-item{padding:0;border:1px solid transparent;cursor:pointer;transition:all .25s;margin-bottom:8px;background:transparent;font-family:'DM Sans',sans-serif;text-align:left;width:100%;display:flex;align-items:center;gap:12px}
.furn-item.active{border-color:var(--oak);background:rgba(184,137,74,.06)}
.furn-item:hover:not(.active){border-color:var(--border);background:rgba(26,22,18,.03)}
.fi-thumb{width:72px;height:72px;flex-shrink:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.fi-thumb canvas{display:block}
.fi-info{padding:8px 10px 8px 0;flex:1;min-width:0}
.fi-name{font-family:'Instrument Serif',serif;font-size:.88rem;color:var(--dark);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-cat{font-size:.66rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--text);margin-bottom:4px}
.fi-price{font-family:'Instrument Serif',serif;font-size:.9rem;color:var(--accent)}

/* CENTER — 3D VIEWPORT */
.viewport{flex:1;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.vp-toolbar{height:40px;background:var(--cream);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.vpt-item{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--text)}
.vpt-dot{width:8px;height:8px;border-radius:50%;background:var(--oak)}
.vpt-sep{width:1px;height:20px;background:var(--border)}
.view-btns{display:flex;gap:4px;margin-left:auto}
.vb{padding:5px 12px;border:1px solid var(--border);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text);cursor:pointer;background:transparent;font-family:'DM Sans',sans-serif;transition:all .2s}
.vb.active{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.vb:hover:not(.active){border-color:var(--dark)}
.vp-canvas-wrap{flex:1;position:relative;overflow:hidden}
canvas#furnCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
canvas#furnCanvas:active{cursor:grabbing}
.vp-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:rgba(26,22,18,.3);pointer-events:none}

/* Dimensions overlay */
.dim-overlay{position:absolute;top:14px;left:14px;background:rgba(253,248,242,.92);border:1px solid var(--border);padding:10px 14px;pointer-events:none;backdrop-filter:blur(8px)}
.dim-label{font-size:8px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--text);margin-bottom:6px}
.dim-vals{display:flex;gap:12px}
.dv{text-align:center}
.dv-n{font-family:'Instrument Serif',serif;font-size:.95rem;color:var(--dark)}
.dv-l{font-size:.6rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}

/* RIGHT — INFO */
.info-panel{width:280px;flex-shrink:0;border-left:1px solid var(--border);background:var(--cream);overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column}
.info-panel::-webkit-scrollbar{width:3px}
.info-panel::-webkit-scrollbar-thumb{background:var(--border)}
.ip-cat{font-size:8px;font-weight:500;letter-spacing:.35em;text-transform:uppercase;color:var(--text);margin-bottom:8px}
.ip-name{font-family:'Instrument Serif',serif;font-size:1.8rem;font-weight:400;color:var(--dark);line-height:1.05;margin-bottom:4px}
.ip-price{font-family:'Instrument Serif',serif;font-size:1.4rem;color:var(--accent);margin-bottom:16px}

/* MATERIAL SWATCHES */
.mat-header{font-size:8px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--text);margin-bottom:10px}
.mat-swatches{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.swatch{width:32px;height:32px;border:2px solid transparent;cursor:pointer;transition:all .2s;position:relative}
.swatch.active{border-color:var(--dark)}
.swatch:hover:not(.active){border-color:var(--stonel)}
.swatch-tip{font-size:.62rem;color:var(--text);margin-top:4px;text-align:center;width:32px;position:absolute;top:36px;left:50%;transform:translateX(-50%);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.swatch:hover .swatch-tip{opacity:1}

.ip-divider{height:1px;background:var(--borderl);margin:14px 0}

/* SPECS */
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sg-item{padding:10px 12px;background:var(--bg2);border:1px solid var(--borderl)}
.sgi-val{font-family:'Instrument Serif',serif;font-size:1rem;color:var(--dark);display:block;margin-bottom:2px}
.sgi-label{font-size:.6rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--text)}

/* FEATURES */
.feat-list{list-style:none;margin-bottom:14px}
.feat-list li{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--borderl);font-size:.78rem;color:var(--text)}
.feat-list li::before{content:'—';color:var(--oak);font-size:.7rem;flex-shrink:0}

.ip-desc{font-size:.8rem;color:var(--text);line-height:1.85;margin-bottom:18px;font-weight:300}
.btn-add{width:100%;padding:13px;background:var(--dark);color:var(--cream);font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;border:none;cursor:pointer;transition:background .3s;margin-bottom:8px}
.btn-add:hover{background:var(--oakdark)}
.btn-wish{width:100%;padding:12px;background:transparent;border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:all .3s}
.btn-wish:hover{border-color:var(--dark);color:var(--dark)}
.sp{position:fixed;pointer-events:none;z-index:9999;border-radius:50%;animation:spa .65s ease forwards}
@keyframes spa{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
@media(max-width:1100px){.list-panel{width:180px}.info-panel{width:220px}}
@media(max-width:800px){.info-panel{display:none}}
@media(max-width:600px){.list-panel{width:140px}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ══ FURNITURE DATA ══════════════════════════
const FURNITURE = [

    ],

    features:['Solid oak frame, mortise & tenon joinery','High-resilience foam cushioning','Removable & washable cover','Delivered flat-pack, 30 min assembly'],
    desc:'The Alvar Chair draws from Scandinavian craft tradition — clean angles, generous proportions and the honest use of material. Designed to last a lifetime.',

  },
  {
    id:'canvas', name:'Canvas Sofa', cat:'seating', catLabel:'3-Seat Sofa',
    price:'$3,480', w:220, h:78, d:90,
    materials:[
      {name:'Oatmeal Linen', wood:0xc4915a, fabric:0xf0e8d8, legs:0xb07840},
      {name:'Slate Blue',    wood:0xc4915a, fabric:0x8090a8, legs:0xb07840},
      {name:'Terracotta',    wood:0x8a5a40, fabric:0xc07850, legs:0x704030},
      {name:'Forest',        wood:0x6a8060, fabric:0x4a6040, legs:0x506040},
    ],

    desc:'Canvas is a sofa that does one thing exceptionally well: it makes you want to sit down. Deep cushioning, clean arms, and a frame built to last generations.',
    build: buildSofa,

      {name:'Walnut',         wood:0x5a3520, fabric:0x5a3520, legs:0x3a2010},
      {name:'White Lacquer',  wood:0xf4f0e8, fabric:0xf4f0e8, legs:0xe0dccc},

// ══ BUILD FUNCTIONS — THREE.JS MODELS ══
function boxMesh(w,h,d,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;m.receiveShadow=true;return m;
}
function cylMesh(rT,rB,h,seg,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rT,rB,h,seg),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;
}

function buildChair(mats){
  const g=new THREE.Group();
  const woodMat=new THREE.MeshStandardMaterial({color:mats.wood,roughness:.6,metalness:.05});
  const fabMat=new THREE.MeshStandardMaterial({color:mats.fabric,roughness:.9,metalness:0});

  // Seat cushion
  g.add(boxMesh(.8,.14,.75,fabMat,0,.62,0));
  // Back cushion
  const back=boxMesh(.8,.65,.12,fabMat,0,1.1,.28);back.rotation.x=-.12;g.add(back);
  // Seat frame
  g.add(boxMesh(.84,.05,.78,woodMat,0,.545,0));
  // Armrests
  [-1,1].forEach(s=>{g.add(boxMesh(.06,.04,.72,woodMat,s*.4,.78,.02));});
  // Back uprights
  [-1,1].forEach(s=>{g.add(boxMesh(.06,.72,.06,woodMat,s*.37,1.02,.28));});
  // Top rail
  g.add(boxMesh(.86,.05,.06,woodMat,0,1.4,.28));
  // 4 Legs tapered
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sz])=>{
    const leg=cylMesh(.024,.032,.6,8,woodMat,sx*.35,.27,sz*.33);g.add(leg);
  });
  // Stretcher
  g.add(boxMesh(.7,.03,.03,woodMat,0,.1,0));
  g.position.y=.3;
  return g;
}

function buildSofa(mats){
  const g=new THREE.Group();
  const woodMat=new THREE.MeshStandardMaterial({color:mats.wood,roughness:.55,metalness:.05});
  const fabMat=new THREE.MeshStandardMaterial({color:mats.fabric,roughness:.95,metalness:0});

  // Base platform
  g.add(boxMesh(2.2,.16,.9,woodMat,0,.08,0));
  // Seat cushions x3
  [-1,0,1].forEach(s=>{g.add(boxMesh(.68,.18,.75,fabMat,s*.72,.28,-.04));});
  // Back cushions x3
  [-1,0,1].forEach(s=>{const bc=boxMesh(.68,.52,.14,fabMat,s*.72,.62,.35);bc.rotation.x=-.1;g.add(bc);});
  // Back frame
  g.add(boxMesh(2.22,.6,.08,woodMat,0,.66,.43));
  g.add(boxMesh(2.22,.05,.92,woodMat,0,.39,.0));
  // Armrests
  [-1,1].forEach(s=>{g.add(boxMesh(.12,.48,.88,fabMat,s*1.06,.38,.0));});
  // Arm tops (wood)
  [-1,1].forEach(s=>{g.add(boxMesh(.14,.05,.9,woodMat,s*1.06,.63,.0));});
  // 6 Legs
  for(let sx=-1;sx<=1;sx++){[-1,1].forEach(sz=>{if(sx===0&&sz===1)return;g.add(cylMesh(.024,.03,.16,8,woodMat,sx*.9,.07,sz*.38));});};
  g.position.y=.15;
  return g;
}

function buildTable(mats){
  const g=new THREE.Group();
  const woodMat=new THREE.MeshStandardMaterial({color:mats.wood,roughness:.5,metalness:.02});
  const steelMat=new THREE.MeshStandardMaterial({color:mats.legs,roughness:.35,metalness:.7});

  // Tabletop
  g.add(boxMesh(2.0,.045,.9,woodMat,0,.845,0));
  // Edge detailing (slight chamfer sim)
  g.add(boxMesh(2.02,.02,.02,woodMat,0,.835,.46));
  g.add(boxMesh(2.02,.02,.02,woodMat,0,.835,-.46));

  // Trestle legs (2 A-frames)
  [-1,1].forEach(s=>{
    // Horizontal beam top
    g.add(boxMesh(.06,.06,.8,steelMat,s*.72,.72,0));
    // 2 Legs per trestle
    [-1,1].forEach(side=>{
      const leg=boxMesh(.05,.05,.72,steelMat,s*.72,.42,side*.35);leg.rotation.x=side*.22;g.add(leg);
    });
    // Foot bar
    g.add(boxMesh(.06,.04,.72,steelMat,s*.72,.06,0));
  });
  // Central stretcher
  g.add(boxMesh(1.46,.04,.04,steelMat,0,.38,0));
  g.position.y=.1;
  return g;
}

function buildShelf(mats){
  const g=new THREE.Group();
  const woodMat=new THREE.MeshStandardMaterial({color:mats.wood,roughness:.55,metalness:.02});

  // Back panel (thin)
  g.add(boxMesh(.9,.02,1.8,woodMat,0,.9,-.14));
  // Rotate the whole thing to stand vertical
  // Side panels
  [-1,1].forEach(s=>{g.add(boxMesh(.03,1.8,.3,woodMat,s*.435,.9,0));});
  // 5 Shelves
  for(let i=0;i<5;i++){g.add(boxMesh(.87,.025,.3,woodMat,0,i*.38+.06,0));}
  // Top panel
  g.add(boxMesh(.9,.03,.3,woodMat,0,1.815,0));

  g.position.y=.02;
  return g;
}

function buildStool(mats){
  const g=new THREE.Group();
  const woodMat=new THREE.MeshStandardMaterial({color:mats.wood,roughness:.5,metalness:.05});
  const seatMat=new THREE.MeshStandardMaterial({color:mats.fabric,roughness:.8,metalness:0});

  // Seat (slightly domed cylinder)
  const seat=new THREE.Mesh(new THREE.CylinderGeometry(.18,.185,.06,32),seatMat);
  seat.position.y=.75;seat.castShadow=true;g.add(seat);
  // Seat edge ring
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.185,.008,8,32),woodMat);
  ring.rotation.x=Math.PI/2;ring.position.y=.72;g.add(ring);

  // 4 Tapered legs
  [[1,1],[-1,1],[-1,-1],[1,-1]].forEach(([sx,sz])=>{
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.014,.022,.68,8),woodMat);
    leg.position.set(sx*.14,.37,sz*.14);
    leg.rotation.x=sz*.12;leg.rotation.z=sx*.1;
    leg.castShadow=true;g.add(leg);
  });
  // Rungs
  [0,1].forEach(axis=>{
    const r=new THREE.Mesh(new THREE.CylinderGeometry(.01,.01,.28,8),woodMat);
    r.position.y=.3;
    if(axis===0)r.rotation.z=Math.PI/2;else r.rotation.x=Math.PI/2;
    g.add(r);
  });
  g.position.y=.025;
  return g;
}

function buildSideTable(mats){
  const g=new THREE.Group();
  const woodMat=new THREE.MeshStandardMaterial({color:mats.wood,roughness:.55,metalness:.02});
  const handleMat=new THREE.MeshStandardMaterial({color:0xd4a840,roughness:.2,metalness:.9});

  // Top
  g.add(boxMesh(.45,.022,.4,woodMat,0,.5,0));
  // Drawer box
  g.add(boxMesh(.42,.12,.36,woodMat,0,.4,0));
  // Drawer face
  g.add(boxMesh(.43,.11,.022,woodMat,0,.4,.205));
  // Brass handle
  g.add(cylMesh(.008,.008,.1,8,handleMat,0,.4,.218));
  // 4 Legs
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sz])=>{
    g.add(cylMesh(.016,.022,.48,8,woodMat,sx*.18,.24,sz*.16));
  });
  // Bottom shelf
  g.add(boxMesh(.38,.016,.34,woodMat,0,.06,0));
  g.position.y=.025;
  return g;
}

// ══ THREE.JS SETUP ══
const canvas=document.getElementById('furnCanvas');
const vwrap=document.querySelector('.vp-canvas-wrap');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0xf4f1ec,1);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf4f1ec);

const camera=new THREE.PerspectiveCamera(42,1,.1,100);
camera.position.set(2,2,3);camera.lookAt(0,.5,0);

function resize(){const w=vwrap.clientWidth,h=vwrap.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);

// Lights
scene.add(new THREE.AmbientLight(0xf0e8d8,2.5));
const sun=new THREE.DirectionalLight(0xfff8f0,3);
sun.position.set(4,6,3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=.5;sun.shadow.camera.far=30;sun.shadow.camera.left=-5;sun.shadow.camera.right=5;sun.shadow.camera.top=5;sun.shadow.camera.bottom=-5;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xe0d8f0,1.2);fill.position.set(-3,2,-2);scene.add(fill);
const rim=new THREE.PointLight(0xffffff,1,10);rim.position.set(-2,4,0);scene.add(rim);

// Floor
const floorMat=new THREE.MeshStandardMaterial({color:0xeae6df,roughness:.8,metalness:0});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),floorMat);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

// Grid lines on floor (subtle)
const gridHelper=new THREE.GridHelper(10,20,0xd8d4cc,0xd8d4cc);
gridHelper.position.y=.001;gridHelper.material.opacity=.3;gridHelper.material.transparent=true;
scene.add(gridHelper);

// ── ACTIVE ITEM ──
let currentMesh=null, currentFurn=null, currentMatIdx=0;

function loadFurniture(f, matIdx=0){
  currentFurn=f;currentMatIdx=matIdx;
  if(currentMesh){scene.remove(currentMesh);currentMesh=null;}
  const mats=f.materials[matIdx];
  currentMesh=f.build(mats);
  // Center it
  const box=new THREE.Box3().setFromObject(currentMesh);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  currentMesh.position.sub(new THREE.Vector3(center.x,box.min.y,center.z));
  scene.add(currentMesh);

  // Auto-fit camera
  const maxDim=Math.max(size.x,size.y,size.z);
  const idealDist=maxDim*2.2;
  camera.position.set(idealDist*.7,idealDist*.6,idealDist*.8);
  camera.lookAt(0,size.y*.4,0);
  targetY=size.y*.4;

  // Update UI
  document.getElementById('vpName').textContent=f.name;
  document.getElementById('ipCat').textContent=f.catLabel;
  document.getElementById('ipName').textContent=f.name;
  document.getElementById('ipPrice').textContent=f.price;
  document.getElementById('dimW').textContent=f.w;
  document.getElementById('dimH').textContent=f.h;
  document.getElementById('dimD').textContent=f.d;
  document.getElementById('ipDesc').textContent=f.desc;

  // Material swatches
  const sw=document.getElementById('matSwatches');
  sw.innerHTML='';
  f.materials.forEach((m,i)=>{
    const s=document.createElement('div');s.className='swatch'+(i===matIdx?' active':'');
    s.style.background=`#${m.wood.toString(16).padStart(6,'0')}`;
    s.title=m.name;
    const tip=document.createElement('div');tip.className='swatch-tip';tip.textContent=m.name;s.appendChild(tip);
    s.onclick=()=>{loadFurniture(f,i);};
    sw.appendChild(s);
  });

  // Specs
  const sg=document.getElementById('specGrid');sg.innerHTML='';
  f.specs.forEach(sp=>{sg.innerHTML+=`<div class="sg-item"><span class="sgi-val">${sp.v}</span><div class="sgi-label">${sp.l}</div></div>`;});

  // Features
  document.getElementById('featList').innerHTML=f.features.map(ft=>`<li>${ft}</li>`).join('');

  // List highlight
  document.querySelectorAll('.furn-item').forEach(el=>el.classList.toggle('active',el.dataset.id===f.id));
}

// ── BUILD LIST ITEMS ──
const listItems=document.getElementById('listItems');
function buildList(filter='all'){
  listItems.innerHTML='';
  FURNITURE.filter(f=>filter==='all'||f.cat===filter).forEach(f=>{
    const btn=document.createElement('button');
    btn.className='furn-item'+(f.id===currentFurn?.id?' active':'');
    btn.dataset.id=f.id;
    btn.onclick=()=>{loadFurniture(f,0);};
    const thumb=document.createElement('div');thumb.className='fi-thumb';
    const tc=document.createElement('canvas');tc.width=72;tc.height=72;
    thumb.appendChild(tc);btn.appendChild(thumb);
    const info=document.createElement('div');info.className='fi-info';
    info.innerHTML=`<div class="fi-cat">${f.catLabel}</div><div class="fi-name">${f.name}</div><div class="fi-price">${f.price}</div>`;
    btn.appendChild(info);
    listItems.appendChild(btn);
    drawThumb(tc,f);
  });
}
buildList();

function drawThumb(tc,f){
  // Tiny Three.js scene for thumbnail
  const r2=new THREE.WebGLRenderer({canvas:tc,antialias:true});
  r2.setPixelRatio(1);r2.setSize(72,72);r2.setClearColor(0xeae6df,1);
  r2.shadowMap.enabled=false;
  r2.toneMapping=THREE.ACESFilmicToneMapping;r2.toneMappingExposure=1.1;
  const s2=new THREE.Scene();
  s2.add(new THREE.AmbientLight(0xffffff,2.5));
  const dl=new THREE.DirectionalLight(0xfff8f0,2.5);dl.position.set(2,3,2);s2.add(dl);
  const dl2=new THREE.DirectionalLight(0xe0d8f0,1);dl2.position.set(-2,1,-1);s2.add(dl2);
  const c2=new THREE.PerspectiveCamera(42,1,.1,100);
  const m2=f.build(f.materials[0]);
  const box=new THREE.Box3().setFromObject(m2);
  const sz=box.getSize(new THREE.Vector3());
  const ce=box.getCenter(new THREE.Vector3());
  m2.position.sub(new THREE.Vector3(ce.x,box.min.y,ce.z));
  s2.add(m2);
  const md=Math.max(sz.x,sz.y,sz.z);
  c2.position.set(md*1.1,md*.9,md*1.1);c2.lookAt(0,sz.y*.4,0);
  r2.render(s2,c2);
}

// Filter buttons
document.querySelectorAll('.lf').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.lf').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    buildList(btn.dataset.f);
  });
});

// Load first item
loadFurniture(FURNITURE[0]);

// ── ORBIT CONTROLS ──
let isDrag=false,prevX=0,prevY=0,rotY=0,rotX=.4,zoom=1,velX=0,velY=0,targetY=.5;
function getRadius(){return Math.max(currentFurn?Math.max(currentFurn.w,currentFurn.h,currentFurn.d)*.03*2.2:3,1.5)*zoom;}
function updateCam(){
  const r=getRadius();
  camera.position.x=Math.sin(rotY)*Math.cos(rotX)*r;
  camera.position.y=Math.max(.1,Math.sin(rotX)*r)+targetY;
  camera.position.z=Math.cos(rotY)*Math.cos(rotX)*r;
  camera.lookAt(0,targetY,0);
}
vwrap.addEventListener('mousedown',e=>{isDrag=true;prevX=e.clientX;prevY=e.clientY;});
window.addEventListener('mouseup',()=>{isDrag=false;});
window.addEventListener('mousemove',e=>{
  if(!isDrag)return;
  const dx=e.clientX-prevX,dy=e.clientY-prevY;
  velX+=dx*.008;velY+=dy*.005;
  rotY+=dx*.008;rotX=Math.max(-.1,Math.min(1.3,rotX-dy*.005));
  prevX=e.clientX;prevY=e.clientY;updateCam();
});
vwrap.addEventListener('wheel',e=>{zoom=Math.max(.5,Math.min(2.5,zoom+e.deltaY*.001));updateCam();e.preventDefault();},{passive:false});
vwrap.addEventListener('touchstart',e=>{isDrag=true;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',()=>{isDrag=false;});
window.addEventListener('touchmove',e=>{if(!isDrag)return;const dx=e.touches[0].clientX-prevX,dy=e.touches[0].clientY-prevY;rotY+=dx*.008;rotX=Math.max(-.1,Math.min(1.3,rotX-dy*.005));prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;updateCam();},{passive:true});

// View buttons
document.querySelectorAll('.vb').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.vb').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const v=btn.dataset.v;
    if(v==='perspective'){rotY=Math.PI*.25;rotX=.5;}
    else if(v==='front'){rotY=0;rotX=.05;}
    else if(v==='side'){rotY=Math.PI/2;rotX=.05;}
    else if(v==='top'){rotY=0;rotX=1.45;}
    updateCam();
  });
});

// Add to cart sparkle
document.getElementById('addBtn').addEventListener('click',function(){
  const r=this.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  ['#c9803a','#e8a050','#f4f1ec'].forEach((col,ci)=>{for(let i=ci;i<14;i+=3){const s=document.createElement('div');s.className='sp';const a=(i/14)*Math.PI*2,d=18+Math.random()*38,sz=2+Math.random()*5;s.style.cssText=`left:${cx-sz/2}px;top:${cy-sz/2}px;width:${sz}px;height:${sz}px;background:${col};--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),700);}});
});

// Auto-gentle rotation
let autoRot=true,autoTo;
vwrap.addEventListener('mousedown',()=>{autoRot=false;clearTimeout(autoTo);});
window.addEventListener('mouseup',()=>{autoTo=setTimeout(()=>{autoRot=true;},4000);});

let tt=0;
(function animate(){
  requestAnimationFrame(animate);tt+=.008;
  if(autoRot){rotY+=.004;updateCam();}
  renderer.render(scene,camera);
})();
</script>
</body>
