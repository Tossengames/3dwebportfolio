<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>間 MA — Virtual Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0806;font-family:'Cormorant Garamond',serif;overflow:hidden;height:100vh;width:100vw;user-select:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}

#logo{position:absolute;top:18px;left:24px;font-family:'Noto Serif JP',serif;font-weight:200;font-size:1.05rem;letter-spacing:.4em;color:#e0d4b8;pointer-events:all;cursor:default}
#logo span{color:#c0392b;font-size:1.4rem;margin-right:8px}

#zoom{position:absolute;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;pointer-events:all}
.zbtn{width:44px;height:44px;background:rgba(10,7,3,.88);border:1px solid rgba(184,148,63,.35);color:#b8943f;font-size:1.5rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:2px;transition:all .2s;font-family:'Cormorant Garamond',serif}
.zbtn:hover{background:rgba(184,148,63,.22);border-color:#c8a84a;color:#d4b860}

#settToggle{position:absolute;left:22px;top:50%;transform:translateY(-50%);pointer-events:all;transition:left .3s ease}
#settToggle button{width:44px;height:44px;background:rgba(10,7,3,.88);border:1px solid rgba(184,148,63,.35);color:#b8943f;font-size:1.1rem;cursor:pointer;border-radius:2px;transition:all .2s}
#settToggle button:hover{background:rgba(184,148,63,.22);border-color:#c8a84a}

#panel{position:absolute;left:0;top:0;bottom:0;width:272px;background:rgba(4,2,1,.97);border-right:1px solid rgba(184,148,63,.18);transform:translateX(-100%);transition:transform .32s ease;overflow-y:auto;padding:66px 0 100px;pointer-events:all}
#panel.open{transform:translateX(0)}
.ps{padding:14px 18px;border-bottom:1px solid rgba(184,148,63,.09)}
.ps h4{font-family:'Noto Serif JP',serif;font-weight:200;font-size:.58rem;letter-spacing:.46em;color:#b8943f;text-transform:uppercase;margin-bottom:12px}
.pr{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.pr label{font-size:.72rem;letter-spacing:.06em;color:#c0b090}
.pr input[type=range]{width:108px;height:3px;-webkit-appearance:none;background:rgba(184,148,63,.2);border-radius:2px;cursor:pointer;outline:none}
.pr input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#b8943f;cursor:pointer;border:none}
.sws{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.sw{width:24px;height:24px;border-radius:2px;cursor:pointer;border:2px solid transparent;transition:all .2s;flex-shrink:0}
.sw:hover,.sw.on{border-color:#b8943f;transform:scale(1.1)}
.pbt{width:100%;padding:9px 14px;background:rgba(184,148,63,.08);border:1px solid rgba(184,148,63,.18);color:#b8943f;font-family:inherit;font-size:.74rem;letter-spacing:.1em;cursor:pointer;margin-top:5px;transition:all .2s;text-align:left}
.pbt:hover{background:rgba(184,148,63,.2);border-color:rgba(184,148,63,.42)}
.pbt.on{background:rgba(184,148,63,.18);border-color:#b8943f}
/* Color picker row */
.cprow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cprow label{font-size:.7rem;letter-spacing:.05em;color:#a09070;width:72px;flex-shrink:0}
.cprow .sws{margin-top:0;flex:1}

#picker{position:absolute;bottom:0;left:0;right:0;padding:10px 20px 16px;background:linear-gradient(to top,rgba(0,0,0,.93) 55%,transparent);display:flex;gap:11px;overflow-x:auto;pointer-events:all;align-items:flex-end;scrollbar-width:thin;scrollbar-color:rgba(184,148,63,.2) transparent}
#picker::-webkit-scrollbar{height:3px}
#picker::-webkit-scrollbar-thumb{background:rgba(184,148,63,.28);border-radius:2px}
.th{flex-shrink:0;width:58px;cursor:pointer;text-align:center;opacity:.5;transition:all .28s}
.th:hover{opacity:.88;transform:translateY(-4px)}
.th.on{opacity:1;transform:translateY(-7px)}
.th canvas{display:block;width:58px;height:75px;border:1.5px solid rgba(184,148,63,.18);border-radius:1px}
.th.on canvas{border-color:#b8943f;box-shadow:0 2px 14px rgba(184,148,63,.28)}
.th span{font-size:.52rem;letter-spacing:.08em;color:#908060;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#info{position:absolute;bottom:108px;left:50%;transform:translateX(-50%);background:rgba(4,2,1,.92);border:1px solid rgba(184,148,63,.28);padding:14px 28px;text-align:center;opacity:0;transition:opacity .4s;pointer-events:all;backdrop-filter:blur(10px);white-space:nowrap}
#info.show{opacity:1}
#info h3{font-weight:300;font-size:1.15rem;color:#e8dfc8;margin-bottom:3px;letter-spacing:.04em}
#info p{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:#7a6d58;margin-bottom:5px}
#info .price{color:#b8943f;font-size:.9rem;display:block;margin-bottom:10px}
#info button{background:#c0392b;color:#fff;padding:8px 22px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border:none;font-family:inherit;transition:background .2s}
#info button:hover{background:#a02820}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="logo"><span>間</span>MA Gallery</div>
  <div id="zoom">
    <div class="zbtn" id="zIn">+</div>
    <div class="zbtn" id="zOut">−</div>
  </div>
  <div id="settToggle"><button onclick="togglePanel()">⚙</button></div>

  <div id="panel">
    <div class="ps"><h4>Lighting</h4>
      <div class="pr"><label>Brightness</label><input type="range" id="sBr" min="30" max="115" value="88"></div>
      <div class="pr"><label>Warmth</label><input type="range" id="sWm" min="0" max="100" value="52"></div>
      <div class="pr"><label>Spotlight</label><input type="range" id="sSp" min="0" max="100" value="68"></div>
    </div>

    <div class="ps"><h4>Wall Colour</h4><div class="sws" id="wallSw"></div></div>
    <div class="ps"><h4>Floor</h4><div class="sws" id="floorSw"></div></div>

    <div class="ps"><h4>Back Wall Style</h4>
      <button class="pbt on" id="bwPlain"  onclick="setBW('plain')">▭&nbsp; Plain Plaster</button>
      <button class="pbt"    id="bwShoji"  onclick="setBW('shoji')">⊞&nbsp; Shoji Panels</button>
      <button class="pbt"    id="bwDark"   onclick="setBW('dark')">▬&nbsp; Dark Wood</button>
    </div>

    <div class="ps"><h4>Scroll — Rollers</h4>
      <div class="sws" id="rollerSw"></div>
    </div>
    <div class="ps"><h4>Scroll — Silk Mount</h4>
      <div class="sws" id="silkSw"></div>
    </div>
    <div class="ps"><h4>Scroll — Paper Tone</h4>
      <div class="sws" id="paperSw"></div>
    </div>
    <div class="ps"><h4>Scroll — Strip</h4>
      <div class="sws" id="stripSw"></div>
    </div>

    <div class="ps"><h4>Time of Day</h4>
      <button class="pbt" onclick="tod('day')">☀&nbsp; Daytime</button>
      <button class="pbt" onclick="tod('dusk')">🌇&nbsp; Dusk</button>
      <button class="pbt" onclick="tod('night')">🌙&nbsp; Night</button>
    </div>
  </div>

  <div id="info">
    <h3 id="iT">Enso</h3>
    <p id="iM">Sumi Ink on Washi · 2024</p>
    <span class="price" id="iP">From $120</span>
    <button onclick="alert('Opens affiliate link for: '+document.getElementById('iT').textContent)">View &amp; Purchase</button>
  </div>
  <div id="picker"></div>
</div>

<script>
// ── Safe ellipse ──
const _ell=CanvasRenderingContext2D.prototype.ellipse;
CanvasRenderingContext2D.prototype.ellipse=function(x,y,rx,ry,rot,sa,ea,acw){_ell.call(this,x,y,Math.max(.001,Math.abs(rx||0)),Math.max(.001,Math.abs(ry||0)),rot||0,sa,ea,!!acw);};

const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H;
function resize(){canvas.width=window.innerWidth*devicePixelRatio;canvas.height=window.innerHeight*devicePixelRatio;W=canvas.width;H=canvas.height;buildTextures();}
window.addEventListener('resize',resize);

// ── Camera ──
let camFOV=900, fovT=900;
document.getElementById('zIn').onclick =()=>fovT=Math.min(1300,fovT+110);
document.getElementById('zOut').onclick=()=>fovT=Math.max(700,fovT-110);
window.addEventListener('wheel',e=>{e.preventDefault();fovT=Math.max(700,Math.min(1300,fovT+e.deltaY*.7));},{passive:false});
let pinchD=null;
window.addEventListener('touchstart',e=>{if(e.touches.length===2)pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
window.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchD){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);fovT=Math.max(700,Math.min(1300,fovT*(d/pinchD)));pinchD=d;}},{passive:true});
window.addEventListener('touchend',()=>{pinchD=null;});

// ── Settings ──
const S={
  br:.88, wm:.52, sp:.68,
  wall:'#ece6d8', floor:'tatami', night:0, bw:'plain',
  roller:'wood',  silk:'gold',  paper:'warm', strip:'red'
};

document.getElementById('sBr').oninput=e=>S.br=e.target.value/100;
document.getElementById('sWm').oninput=e=>S.wm=e.target.value/100;
document.getElementById('sSp').oninput=e=>S.sp=e.target.value/100;

function togglePanel(){const p=document.getElementById('panel');p.classList.toggle('open');document.getElementById('settToggle').style.left=p.classList.contains('open')?'288px':'22px';}

function tod(t){
  if(t==='day') {S.br=.88;S.wm=.52;S.sp=.68;S.night=0;document.getElementById('sBr').value=88;document.getElementById('sWm').value=52;document.getElementById('sSp').value=68;}
  if(t==='dusk'){S.br=.60;S.wm=.88;S.sp=.55;S.night=0;document.getElementById('sBr').value=60;document.getElementById('sWm').value=88;document.getElementById('sSp').value=55;}
  if(t==='night'){S.br=.36;S.wm=.72;S.sp=.40;S.night=.8;document.getElementById('sBr').value=36;document.getElementById('sWm').value=72;document.getElementById('sSp').value=40;}
}

function setBW(v){S.bw=v;['plain','shoji','dark'].forEach(k=>document.getElementById('bw'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('on',k===v));}

function makeSw(id,presets,key){
  const el=document.getElementById(id);
  presets.forEach(([col,label])=>{
    const sw=document.createElement('div');
    sw.className='sw'+(S[key]===label?' on':'');
    sw.style.background=col; sw.title=label;
    sw.onclick=()=>{S[key]=label;el.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));sw.classList.add('on');};
    el.appendChild(sw);
  });
}

// Wall colours
makeSw('wallSw', [
  ['#ece6d8','#ece6d8'],['#ddd5c5','#ddd5c5'],['#e0ddd0','#e0ddd0'],
  ['#d5ddd5','#d5ddd5'],['#d8d0c8','#d8d0c8'],['#2a2218','#2a2218'],
  ['#1e2428','#1e2428'],['#28201c','#28201c']
], 'wall');

// Floor
makeSw('floorSw', [
  ['linear-gradient(135deg,#c8b888,#a09050)','tatami'],
  ['#8b7040','#8b7040'],['#5a4a2a','#5a4a2a'],
  ['#c8b888','#c8b888'],['#6a7850','#6a7850'],['#3a3020','#3a3020']
], 'floor');

// Scroll roller colours
makeSw('rollerSw', [
  ['linear-gradient(135deg,#b88840,#7a5420)','wood'],
  ['linear-gradient(135deg,#e8e0d0,#c8bca8)','ivory'],
  ['linear-gradient(135deg,#1a1410,#0a0806)','ebony'],
  ['linear-gradient(135deg,#8a2020,#4a0808)','lacquer-red'],
  ['linear-gradient(135deg,#184828,#0a2814)','lacquer-green'],
  ['linear-gradient(135deg,#c8a030,#886010)','gold'],
], 'roller');

// Scroll silk mount colours
makeSw('silkSw', [
  ['linear-gradient(135deg,#c8943f,#8a6020)','gold'],
  ['linear-gradient(135deg,#7a3020,#4a1408)','crimson'],
  ['linear-gradient(135deg,#204060,#102030)','indigo'],
  ['linear-gradient(135deg,#184828,#0a2010)','forest'],
  ['linear-gradient(135deg,#c8b898,#a09070)','sand'],
  ['linear-gradient(135deg,#282018,#181008)','dark'],
], 'silk');

// Scroll paper tone
makeSw('paperSw', [
  ['#ede0c0','warm'],
  ['#e8e4d8','cool'],
  ['#f0ece4','white'],
  ['#d8c8a0','aged'],
  ['#c8b888','golden'],
  ['#e0d8c8','grey'],
], 'paper');

// Scroll strip colour
makeSw('stripSw', [
  ['#8a1818','red'],
  ['#b8943f','gold'],
  ['#184828','green'],
  ['#1a1a3a','navy'],
  ['#3a1a38','purple'],
  ['#2a1a08','brown'],
], 'strip');

// ── Noise & Textures ──
function n2(x,y){const X=x|0,Y=y|0,fx=x-X,fy=y-Y,hh=(a,b)=>{let v=(a*127+b)*311;v^=v>>>16;v=Math.imul(v,0x45d9f3b);v^=v>>>16;return((v&0xff)/255)*2-1;},ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);return(hh(X,Y)*(1-ux)+hh(X+1,Y)*ux)*(1-uy)+(hh(X,Y+1)*(1-ux)+hh(X+1,Y+1)*ux)*uy;}
function mkTex(w,h,fn){const oc=document.createElement('canvas');oc.width=w;oc.height=h;const c=oc.getContext('2d'),id=c.createImageData(w,h);for(let i=0;i<w*h;i++){const[r,g,b]=fn(i%w,i/w|0);id.data[i*4]=r;id.data[i*4+1]=g;id.data[i*4+2]=b;id.data[i*4+3]=255;}c.putImageData(id,0,0);return oc;}

let txWall,txTatami,txWood,txPaper,txSilk,txRoller,txPlaster;
function buildTextures(){
  // Plaster — fine grain
  txPlaster=mkTex(256,256,(x,y)=>{const n=n2(x*.06,y*.06)*14+n2(x*.2,y*.18)*6+n2(x*.8,y*.7)*3,v=230+n;return[v,v-3,v-9];});
  // Tatami — weave
  txTatami=mkTex(128,128,(x,y)=>{const w=((x%10<5)!==(y%10<5))?14:0,n=n2(x*.1,y*.1)*9;return[160+w+n,146+w+n,78+w*.3+n*.4];});
  // Wood grain — for trim & rollers
  txWood=mkTex(64,256,(x,y)=>{const g=Math.sin(y*.18+n2(x*.3,y*.04)*3.5)*12+n2(x*.8,y*.5)*4;return[182+g,128+g*.55,62+g*.25];});
  // Washi paper — fibrous
  txPaper=mkTex(256,256,(x,y)=>{const n=n2(x*.07,y*.07)*16+n2(x*.25,y*.22)*6,f=n2(x*1.2,y*.3)*3;return[Math.min(255,234+n+f),Math.min(255,218+n+f*.7),Math.min(255,188+n*.8)];});
  // Silk brocade — fine cross-weave
  txSilk=mkTex(64,64,(x,y)=>{const h=((x%4<2)!==(y%4<2))?8:0,d=((x%8<4)!==(y%8<4))?4:0,n=n2(x*.2,y*.2)*5;return[188+h+d+n,148+h+d*0.6+n,60+h*.3+n*.3];});
  // Roller — fine wood grain tighter
  txRoller=mkTex(32,128,(x,y)=>{const g=Math.sin(y*.25+n2(x*.5,y*.06)*2.5)*10+n2(x,y*.1)*4;return[178+g,132+g*.5,58+g*.25];});
  // Reuse txWall from plaster
  txWall=txPlaster;
}

// ── 3D ──
const L=(a,b,t)=>a+(b-a)*t;
const R=(v)=>Math.round(Math.max(0,Math.min(255,v)));
const RX=4,RY=2,ZN=1,ZF=9;

function project(px,py,pz){if(pz<=0.05)return null;const f=camFOV/pz;return[W/2+px*f,H/2+py*f,pz];}
function projPoly(pts){const out=[];for(const p of pts){const r=project(p[0],p[1],p[2]);if(!r)return null;out.push(r);}return out;}

function fillQuad(pts3,fill,alpha){
  const p=projPoly(pts3);if(!p)return null;
  ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.fillStyle=fill;
  ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fill();ctx.restore();return p;
}
function strokePts(p2d,color,lw){if(!p2d)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p2d[0][0],p2d[0][1]);for(let i=1;i<p2d.length;i++)ctx.lineTo(p2d[i][0],p2d[i][1]);ctx.closePath();ctx.stroke();ctx.restore();}
function clipDraw(pts3,fn){const p=projPoly(pts3);if(!p)return;ctx.save();ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.clip();fn(p);ctx.restore();}
function texQuad(pts3,tex,tint,alpha){
  const p=projPoly(pts3);if(!p)return null;
  const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);
  const x0=Math.min(...xs)-1,y0=Math.min(...ys)-1,x1=Math.max(...xs)+1,y1=Math.max(...ys)+1;
  ctx.save();ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.clip();
  const sc=Math.max(W,H)/512;ctx.save();ctx.scale(sc,sc);ctx.fillStyle=ctx.createPattern(tex,'repeat');ctx.globalAlpha=alpha??0.88;ctx.fillRect(x0/sc,y0/sc,(x1-x0)/sc,(y1-y0)/sc);ctx.restore();
  if(tint){ctx.fillStyle=tint;ctx.fillRect(x0,y0,x1-x0,y1-y0);}ctx.restore();return p;
}

// ── PARSE colour setting into RGB ──
function hexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

// Roller colours lookup
const ROLLER_COLS={
  'wood':      {r:[175,132,58], dark:.68, top:1.12},
  'ivory':     {r:[232,224,210],dark:.75, top:1.08},
  'ebony':     {r:[32,26,18],   dark:.6,  top:1.15},
  'lacquer-red':{r:[148,28,28], dark:.6,  top:1.18},
  'lacquer-green':{r:[26,72,38],dark:.6,  top:1.18},
  'gold':      {r:[210,165,32], dark:.65, top:1.1},
};
// Silk colour lookup [r,g,b]
const SILK_COLS={
  'gold':    [188,142,58],
  'crimson': [148,48,32],
  'indigo':  [38,72,118],
  'forest':  [32,82,45],
  'sand':    [195,178,142],
  'dark':    [42,32,22],
};
// Paper tone lookup
const PAPER_COLS={
  'warm':   [234,220,196],
  'cool':   [228,224,212],
  'white':  [242,238,230],
  'aged':   [218,202,162],
  'golden': [205,188,138],
  'grey':   [222,216,205],
};
// Strip colour lookup
const STRIP_COLS={
  'red':    [148,28,28],
  'gold':   [185,148,40],
  'green':  [28,75,42],
  'navy':   [28,28,72],
  'purple': [68,28,72],
  'brown':  [62,32,12],
};

// ════════════════════════════════════════
//  DRAW
// ════════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#080604';ctx.fillRect(0,0,W,H);
  const br=S.br,wm=S.wm,sp=S.sp;
  let wr=235,wg=230,wb=216;
  if(S.wall.startsWith('#')){wr=parseInt(S.wall.slice(1,3),16);wg=parseInt(S.wall.slice(3,5),16);wb=parseInt(S.wall.slice(5,7),16);}

  // ── CEILING ──
  fillQuad([[-RX,-RY,ZN],[RX,-RY,ZN],[RX,-RY,ZF],[-RX,-RY,ZF]],`rgb(${R(188*br+wm*14)},${R(175*br+wm*7)},${R(152*br)})`);
  [0.25,0.5,0.75].forEach(t=>{const bx=-RX+t*RX*2,pa=projPoly([[bx,-RY,ZN],[bx,-RY,ZF]]);if(pa){ctx.strokeStyle=`rgba(${R(145*br+wm*10)},${R(105*br+wm*5)},${R(42*br)},0.82)`;ctx.lineWidth=6;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(pa[0][0],pa[0][1]);ctx.lineTo(pa[1][0],pa[1][1]);ctx.stroke();}});
  fillQuad([[-1.4,-RY+.01,ZN+1],[1.4,-RY+.01,ZN+1],[1.4,-RY+.01,ZF-1],[-1.4,-RY+.01,ZF-1]],`rgba(255,252,228,${.92*sp})`);
  const lgp=project(0,-RY,ZN+3);if(lgp){const rr=Math.max(W,H)*.7,lg=ctx.createRadialGradient(lgp[0],lgp[1],0,lgp[0],lgp[1],rr);lg.addColorStop(0,`rgba(255,248,215,${.2*sp})`);lg.addColorStop(1,'rgba(255,248,215,0)');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);}

  // ── FLOOR ──
  const flQ=[[-RX,RY,ZN],[RX,RY,ZN],[RX,RY,ZF],[-RX,RY,ZF]];
  if(S.floor==='tatami'&&txTatami){texQuad(flQ,txTatami,`rgba(${R(wm*25)},${R(wm*12)},0,${.12*(1-br*.4)})`);}
  else{let[fr,fg,fb]=[150,130,65];if(S.floor.startsWith('#')){fr=parseInt(S.floor.slice(1,3),16);fg=parseInt(S.floor.slice(3,5),16);fb=parseInt(S.floor.slice(5,7),16);}fillQuad(flQ,`rgb(${R(fr*br)},${R(fg*br)},${R(fb*br)})`);}
  drawTatamiGrid(br);
  const flp=project(0,RY,ZF-.5);if(flp){const fg2=ctx.createRadialGradient(flp[0],flp[1],0,flp[0],flp[1],W*.28);fg2.addColorStop(0,`rgba(255,245,205,${.22*sp})`);fg2.addColorStop(1,'rgba(255,245,205,0)');const fp2=projPoly(flQ);if(fp2){ctx.save();ctx.beginPath();ctx.moveTo(fp2[0][0],fp2[0][1]);fp2.slice(1).forEach(q=>ctx.lineTo(q[0],q[1]));ctx.closePath();ctx.clip();ctx.fillStyle=fg2;ctx.fillRect(0,H*.4,W,H);ctx.restore();}}

  // ── BACK WALL — style switchable ──
  const backQ=[[-RX,-RY,ZF],[RX,-RY,ZF],[RX,RY,ZF],[-RX,RY,ZF]];
  drawBackWall(br,wm,wr,wg,wb,backQ);

  // ── LEFT WALL ──
  const leftQ=[[-RX,-RY,ZN],[-RX,-RY,ZF],[-RX,RY,ZF],[-RX,RY,ZN]];
  const lwBr=br*.82;
  texQuad(leftQ,txWall,`rgba(${R(wr*lwBr+wm*12)},${R(wg*lwBr+wm*6)},${R(wb*lwBr)},0.55)`);
  drawShojiPanels(br,wm);

  // ── RIGHT WALL ──
  const rightQ=[[RX,-RY,ZF],[RX,-RY,ZN],[RX,RY,ZN],[RX,RY,ZF]];
  const rwBr=br*.88;
  texQuad(rightQ,txWall,`rgba(${R(wr*rwBr+wm*10)},${R(wg*rwBr+wm*5)},${R(wb*rwBr)},0.52)`);
  drawFusuma(br,wm);

  // ── WOOD TRIM ──
  drawWoodTrim(br,wm);

  // ── SCROLL ──
  drawScroll(br,wm,sp);

  // ── SPOTLIGHT ──
  const spp=project(0,-RY,ZF-2);if(spp){const sg=ctx.createRadialGradient(spp[0],spp[1],0,spp[0],spp[1],W*.44);sg.addColorStop(0,`rgba(255,248,210,${.26*sp})`);sg.addColorStop(.35,`rgba(255,240,190,${.1*sp})`);sg.addColorStop(1,'rgba(255,240,190,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);}

  // ── VIGNETTE ──
  const vig=ctx.createRadialGradient(W/2,H*.44,H*.1,W/2,H*.44,H*.88);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,`rgba(0,0,0,${.18+S.night*.5})`);ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(S.night>0){ctx.fillStyle=`rgba(4,7,22,${S.night*.42})`;ctx.fillRect(0,0,W,H);}
}

// ── BACK WALL STYLES ──
function drawBackWall(br,wm,wr,wg,wb,backQ){
  if(S.bw==='plain'){
    texQuad(backQ,txWall,`rgba(${R(wr*br+wm*18)},${R(wg*br+wm*9)},${R(wb*br)},0.55)`);
    clipDraw(backQ,p2d=>{const ys=p2d.map(q=>q[1]),xs=p2d.map(q=>q[0]);const y0s=Math.min(...ys),y1s=Math.max(...ys),x0s=Math.min(...xs),x1s=Math.max(...xs);const g=ctx.createLinearGradient(0,y0s,0,y1s);g.addColorStop(0,`rgba(255,250,235,${.09*br})`);g.addColorStop(.35,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,.06)`);ctx.fillStyle=g;ctx.fillRect(x0s,y0s,x1s-x0s,y1s-y0s);});
  } else if(S.bw==='shoji'){
    // Full shoji grid across back wall
    fillQuad(backQ,`rgba(${R(228*br+wm*18)},${R(218*br+wm*10)},${R(200*br)},1)`);
    clipDraw(backQ,()=>{if(txPaper){const sc=Math.max(W,H)/700;ctx.save();ctx.scale(sc,sc);ctx.fillStyle=ctx.createPattern(txPaper,'repeat');ctx.globalAlpha=.8;ctx.fillRect(0,0,W/sc,H/sc);ctx.restore();}ctx.fillStyle=`rgba(255,240,195,${.14*sp*br})`;ctx.fillRect(0,0,W,H);});
    const p2d=projPoly(backQ);if(p2d){
      const rows=5,cols=4;
      ctx.strokeStyle=`rgba(${R(145*br+wm*10)},${R(108*br+wm*5)},${R(48*br)},0.72)`;ctx.lineWidth=2;
      for(let r=0;r<=rows;r++){const t=r/rows;ctx.beginPath();ctx.moveTo(L(p2d[0][0],p2d[3][0],t),L(p2d[0][1],p2d[3][1],t));ctx.lineTo(L(p2d[1][0],p2d[2][0],t),L(p2d[1][1],p2d[2][1],t));ctx.stroke();}
      for(let c=0;c<=cols;c++){const t=c/cols;ctx.beginPath();ctx.moveTo(L(p2d[0][0],p2d[1][0],t),L(p2d[0][1],p2d[1][1],t));ctx.lineTo(L(p2d[3][0],p2d[2][0],t),L(p2d[3][1],p2d[2][1],t));ctx.stroke();}
      ctx.strokeStyle=`rgba(${R(145*br)},${R(108*br)},${R(48*br)},0.25)`;ctx.lineWidth=.8;
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
        const rm=(r+.5)/rows,cm=(c+.5)/cols;
        ctx.beginPath();ctx.moveTo(L(L(p2d[0][0],p2d[1][0],c/cols),L(p2d[3][0],p2d[2][0],c/cols),rm),L(L(p2d[0][1],p2d[1][1],c/cols),L(p2d[3][1],p2d[2][1],c/cols),rm));ctx.lineTo(L(L(p2d[0][0],p2d[1][0],(c+1)/cols),L(p2d[3][0],p2d[2][0],(c+1)/cols),rm),L(L(p2d[0][1],p2d[1][1],(c+1)/cols),L(p2d[3][1],p2d[2][1],(c+1)/cols),rm));ctx.stroke();
      }
    }
  } else if(S.bw==='dark'){
    texQuad(backQ,txWood,`rgba(${R(20*br+wm*8)},${R(14*br+wm*4)},${R(6*br)},0.5)`);
    fillQuad(backQ,`rgba(${R(35*br+wm*12)},${R(25*br+wm*6)},${R(12*br)},.45)`);
    // Horizontal plank lines
    const p2d=projPoly(backQ);if(p2d){ctx.strokeStyle=`rgba(0,0,0,${.3*br})`;ctx.lineWidth=1;for(let i=1;i<8;i++){const t=i/8;ctx.beginPath();ctx.moveTo(L(p2d[0][0],p2d[3][0],t),L(p2d[0][1],p2d[3][1],t));ctx.lineTo(L(p2d[1][0],p2d[2][0],t),L(p2d[1][1],p2d[2][1],t));ctx.stroke();}ctx.strokeStyle=`rgba(255,220,150,${.06*br})`;for(let i=1;i<8;i++){const t=i/8+.005;ctx.beginPath();ctx.moveTo(L(p2d[0][0],p2d[3][0],t),L(p2d[0][1],p2d[3][1],t));ctx.lineTo(L(p2d[1][0],p2d[2][0],t),L(p2d[1][1],p2d[2][1],t));ctx.stroke();}}
  }
}

// ── TATAMI GRID ──
function drawTatamiGrid(br){
  for(let i=0;i<=4;i++){const t=i/4,zz=L(ZN,ZF,t),pa=projPoly([[-RX,RY,zz],[RX,RY,zz]]);if(pa){ctx.strokeStyle=`rgba(72,65,32,${.38+t*.22})`;ctx.lineWidth=.7+t*1.1;ctx.beginPath();ctx.moveTo(pa[0][0],pa[0][1]);ctx.lineTo(pa[1][0],pa[1][1]);ctx.stroke();}}
  for(let i=0;i<=3;i++){const t=i/3,xx=L(-RX,RX,t),pa=projPoly([[xx,RY,ZN],[xx,RY,ZF]]);if(pa){ctx.strokeStyle='rgba(68,60,28,0.26)';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(pa[0][0],pa[0][1]);ctx.lineTo(pa[1][0],pa[1][1]);ctx.stroke();}}
  [.25,.5,.75].forEach(t=>{const zz=L(ZN,ZF,t),pa=projPoly([[-RX,RY,zz],[RX,RY,zz]]);if(pa){ctx.strokeStyle='rgba(42,38,16,0.44)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pa[0][0],pa[0][1]);ctx.lineTo(pa[1][0],pa[1][1]);ctx.stroke();}});
}

// ── WOOD TRIM ──
function drawWoodTrim(br,wm){
  const wc=`rgba(${R(175*br+wm*16)},${R(130*br+wm*8)},${R(55*br)},0.92)`;
  [[[-RX,RY,ZN],[RX,RY,ZN]],[[-RX,RY,ZF],[RX,RY,ZF]],[[-RX,RY,ZN],[-RX,RY,ZF]],[[RX,RY,ZN],[RX,RY,ZF]],[[-RX,-RY,ZN],[RX,-RY,ZN]],[[-RX,-RY,ZF],[RX,-RY,ZF]],[[-RX,-RY,ZN],[-RX,-RY,ZF]],[[RX,-RY,ZN],[RX,-RY,ZF]],[[-RX,-RY,ZN],[-RX,RY,ZN]],[[RX,-RY,ZN],[RX,RY,ZN]],[[-RX,-RY,ZF],[-RX,RY,ZF]],[[RX,-RY,ZF],[RX,RY,ZF]]].forEach(([a,b])=>{const pa=projPoly([a,b]);if(pa){ctx.strokeStyle=wc;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(pa[0][0],pa[0][1]);ctx.lineTo(pa[1][0],pa[1][1]);ctx.stroke();}});
}

// ── SHOJI (left wall) ──
function drawShojiPanels(br,wm){
  const zMid=L(ZN,ZF,.5);
  [{z0:ZN+.4,z1:zMid-.05},{z0:zMid+.05,z1:ZF-.3}].forEach((pn,pi)=>{
    const pts=[[-RX,-RY,pn.z0],[-RX,-RY,pn.z1],[-RX,RY,pn.z1],[-RX,RY,pn.z0]];
    const p2d=projPoly(pts);if(!p2d)return;
    clipDraw(pts,()=>{if(txPaper){const sc=Math.max(W,H)/700;ctx.save();ctx.scale(sc,sc);ctx.fillStyle=ctx.createPattern(txPaper,'repeat');ctx.globalAlpha=.82;ctx.fillRect(0,0,W/sc,H/sc);ctx.restore();}ctx.fillStyle=`rgba(228,218,198,${.45*br+wm*.12})`;ctx.fillRect(0,0,W,H);ctx.fillStyle=`rgba(255,238,185,${.16*S.sp*br})`;ctx.fillRect(0,0,W,H);});
    strokePts(p2d,`rgba(${R(152*br+wm*10)},${R(112*br+wm*5)},${R(50*br)},0.85)`,Math.max(W,H)*.005*(pi===0?1:.78));
    const rows=5,cols=2;ctx.strokeStyle=`rgba(142,105,46,${.4*br})`;ctx.lineWidth=1.1;
    for(let r=0;r<=rows;r++){const t=r/rows;ctx.beginPath();ctx.moveTo(L(p2d[0][0],p2d[3][0],t),L(p2d[0][1],p2d[3][1],t));ctx.lineTo(L(p2d[1][0],p2d[2][0],t),L(p2d[1][1],p2d[2][1],t));ctx.stroke();}
    for(let c=0;c<=cols;c++){const t=c/cols;ctx.beginPath();ctx.moveTo(L(p2d[0][0],p2d[1][0],t),L(p2d[0][1],p2d[1][1],t));ctx.lineTo(L(p2d[3][0],p2d[2][0],t),L(p2d[3][1],p2d[2][1],t));ctx.stroke();}
    ctx.strokeStyle=`rgba(142,105,46,${.17*br})`;ctx.lineWidth=.55;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const rm=(r+.5)/rows,cm=(c+.5)/cols;ctx.beginPath();ctx.moveTo(L(L(p2d[0][0],p2d[1][0],c/cols),L(p2d[3][0],p2d[2][0],c/cols),rm),L(L(p2d[0][1],p2d[1][1],c/cols),L(p2d[3][1],p2d[2][1],c/cols),rm));ctx.lineTo(L(L(p2d[0][0],p2d[1][0],(c+1)/cols),L(p2d[3][0],p2d[2][0],(c+1)/cols),rm),L(L(p2d[0][1],p2d[1][1],(c+1)/cols),L(p2d[3][1],p2d[2][1],(c+1)/cols),rm));ctx.stroke();}
  });
  const gZ=zMid;fillQuad([[-RX-.01,-RY*.3,gZ-.12],[-RX-.01,-RY*.3,gZ+.12],[-RX-.01,RY,gZ+.12],[-RX-.01,RY,gZ-.12]],`rgba(172,162,138,${.88*br})`);
  const rp1=project(-RX-.01,RY*.6,gZ-.04),rp2=project(-RX-.01,RY*.75,gZ+.04);
  if(rp1){ctx.fillStyle=`rgba(118,110,93,${br})`;ctx.beginPath();ctx.ellipse(rp1[0],rp1[1],Math.max(4,rp1[2]*.06),Math.max(3,rp1[2]*.04),0,0,Math.PI*2);ctx.fill();}
  if(rp2){ctx.fillStyle=`rgba(135,125,106,${br})`;ctx.beginPath();ctx.ellipse(rp2[0],rp2[1],Math.max(3,rp2[2]*.045),Math.max(2,rp2[2]*.03),.3,0,Math.PI*2);ctx.fill();}
}

// ── FUSUMA (right wall) ──
function drawFusuma(br,wm){
  const z0f=ZN+.3,z1f=ZF-.25;
  const pts=[[RX,-RY,z0f],[RX,-RY,z1f],[RX,RY,z1f],[RX,RY,z0f]];
  const p2d=projPoly(pts);if(!p2d)return;
  clipDraw(pts,()=>{if(txPaper){const sc=Math.max(W,H)/700;ctx.save();ctx.scale(sc,sc);ctx.fillStyle=ctx.createPattern(txPaper,'repeat');ctx.globalAlpha=.78;ctx.fillRect(0,0,W/sc,H/sc);ctx.restore();}ctx.fillStyle=`rgba(215,206,186,${.48*br+wm*.1})`;ctx.fillRect(0,0,W,H);if(p2d){const cx=(p2d[0][0]+p2d[2][0])/2,cy=(p2d[0][1]+p2d[2][1])/2,sz=Math.abs(p2d[1][0]-p2d[0][0])*.28;ctx.save();ctx.globalAlpha=.1;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(cx+i*sz*.38,cy-i*sz*.08,Math.max(2,sz*.44),Math.max(1,sz*.17),.05+i*.04,0,Math.PI*2);ctx.fillStyle='rgba(78,98,115,1)';ctx.fill();}ctx.restore();}});
  strokePts(p2d,`rgba(${R(152*br+wm*10)},${R(115*br+wm*5)},${R(48*br)},0.78)`,Math.max(W,H)*.004);
  for(let i=1;i<4;i++){const t=i/4;ctx.strokeStyle=`rgba(135,102,44,${.3*br})`;ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(L(p2d[0][0],p2d[3][0],t),L(p2d[0][1],p2d[3][1],t));ctx.lineTo(L(p2d[1][0],p2d[2][0],t),L(p2d[1][1],p2d[2][1],t));ctx.stroke();}
  const hp=project(RX-.025,0,L(z0f,z1f,.5));if(hp){const hr=Math.max(3,hp[2]*.012);ctx.beginPath();ctx.arc(hp[0],hp[1],hr,0,Math.PI*2);ctx.fillStyle=`rgba(28,20,9,${.88*br})`;ctx.fill();}
}

// ════════════════════════════════════════
//  HANGING SCROLL — 3D + fully textured + customisable
// ════════════════════════════════════════
function drawScroll(br,wm,sp){
  const ZD=.20, ZB=ZF-.04, ZFR=ZB-ZD, sw=2.0;
  const yTop=-RY+.10, rH=.12, mountT=.25, paintH=2.10, stripH=.055, mountB=.20;
  const rollerB=yTop+rH+mountT+paintH+stripH+mountB, yBot=rollerB+rH;
  const rx=sw/2+.07;

  // Get colour values from settings
  const rc=ROLLER_COLS[S.roller]||ROLLER_COLS['wood'];
  const [rR,rG,rB]=rc.r;
  const sc2=SILK_COLS[S.silk]||SILK_COLS['gold'];
  const [sR,sG,sB]=sc2;
  const pc=PAPER_COLS[S.paper]||PAPER_COLS['warm'];
  const [pR,pG,pB]=pc;
  const stc=STRIP_COLS[S.strip]||STRIP_COLS['red'];
  const [stR,stG,stB]=stc;

  // Shadow on wall
  fillQuad([[-rx,yTop,ZB+.01],[rx,yTop,ZB+.01],[rx,yBot,ZB+.01],[-rx,yBot,ZB+.01]],'rgba(0,0,0,0.15)',.6);

  // Cords
  const nail=project(0,-RY+.02,ZB),cL=project(-sw/2*.48,yTop,ZFR),cR=project(sw/2*.48,yTop,ZFR);
  if(nail&&cL&&cR){ctx.save();ctx.strokeStyle=`rgba(${R(105*br+wm*12)},${R(78*br+wm*6)},${R(30*br)},0.84)`;ctx.lineWidth=1.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(nail[0],nail[1]);ctx.lineTo(cL[0],cL[1]);ctx.stroke();ctx.beginPath();ctx.moveTo(nail[0],nail[1]);ctx.lineTo(cR[0],cR[1]);ctx.stroke();ctx.beginPath();ctx.arc(nail[0],nail[1],4,0,Math.PI*2);ctx.fillStyle=`rgba(62,45,15,${br})`;ctx.fill();ctx.restore();}

  // ── Roller (textured + coloured) ──
  function roller3D(ty,addWeights){
    const front=[[-rx,ty,ZFR],[rx,ty,ZFR],[rx,ty+rH,ZFR],[-rx,ty+rH,ZFR]];
    // Texture first, then colour tint
    if(txRoller){texQuad(front,txRoller,`rgba(${R(rR*br)},${R(rG*br)},${R(rB*br)},0.6)`);}
    else{fillQuad(front,`rgb(${R(rR*br)},${R(rG*br)},${R(rB*br)})`);}
    // Top face (light)
    fillQuad([[-rx,ty,ZB],[rx,ty,ZB],[rx,ty,ZFR],[-rx,ty,ZFR]],`rgb(${R(rR*br*rc.top)},${R(rG*br*rc.top)},${R(rB*br*rc.top)})`);
    // Bottom face (dark)
    fillQuad([[-rx,ty+rH,ZFR],[rx,ty+rH,ZFR],[rx,ty+rH,ZB],[-rx,ty+rH,ZB]],`rgb(${R(rR*br*rc.dark)},${R(rG*br*rc.dark)},${R(rB*br*rc.dark)})`);
    // Side caps
    fillQuad([[-rx,ty,ZB],[-rx,ty,ZFR],[-rx,ty+rH,ZFR],[-rx,ty+rH,ZB]],`rgb(${R(rR*br*.72)},${R(rG*br*.72)},${R(rB*br*.72)})`);
    fillQuad([[rx,ty,ZFR],[rx,ty,ZB],[rx,ty+rH,ZB],[rx,ty+rH,ZFR]],`rgb(${R(rR*br*.80)},${R(rG*br*.80)},${R(rB*br*.80)})`);
    // Highlight
    fillQuad([[-rx,ty,ZFR],[rx,ty,ZFR],[rx,ty+rH*.28,ZFR],[-rx,ty+rH*.28,ZFR]],`rgba(255,245,200,${.22*br})`);
    strokePts(projPoly(front),`rgba(${R(rR*br*.5)},${R(rG*br*.4)},${R(rB*br*.3)},0.55)`,1);
    if(addWeights){
      [-rx-.02,rx-.04].forEach(wx=>{
        const wp=project(wx,ty+rH*.5,ZFR);
        if(wp){const ws=Math.max(4,wp[2]*.036);ctx.save();const wg2=ctx.createRadialGradient(wp[0],wp[1],0,wp[0],wp[1],ws);wg2.addColorStop(0,`rgba(${R(rR*br+20)},${R(rG*br+15)},${R(rB*br+8)},1)`);wg2.addColorStop(1,`rgba(${R(rR*br*.6)},${R(rG*br*.5)},${R(rB*br*.3)},1)`);ctx.fillStyle=wg2;ctx.beginPath();ctx.ellipse(wp[0],wp[1],ws*.85,ws*1.15,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=`rgba(${R(rR*.4)},${R(rG*.35)},${R(rB*.2)},${.5*br})`;ctx.lineWidth=.8;ctx.stroke();ctx.restore();}
      });
    }
  }

  // ── Silk mount (textured brocade + coloured) ──
  function silk3D(ty,sh){
    const front=[[-sw/2,ty,ZFR],[sw/2,ty,ZFR],[sw/2,ty+sh,ZFR],[-sw/2,ty+sh,ZFR]];
    // Brocade texture tinted with silk colour
    if(txSilk){texQuad(front,txSilk,`rgba(${R(sR*br)},${R(sG*br)},${R(sB*br)},0.65)`);}
    else{fillQuad(front,`rgb(${R(sR*br)},${R(sG*br)},${R(sB*br)})`);}
    // Sheen overlay
    fillQuad(front,`rgba(255,238,168,${.11*br})`);
    // Top/bottom edges
    fillQuad([[-sw/2,ty,ZB],[sw/2,ty,ZB],[sw/2,ty,ZFR],[-sw/2,ty,ZFR]],`rgb(${R(sR*br*1.1)},${R(sG*br*1.1)},${R(sB*br*1.1)})`);
    fillQuad([[-sw/2,ty+sh,ZFR],[sw/2,ty+sh,ZFR],[sw/2,ty+sh,ZB],[-sw/2,ty+sh,ZB]],`rgb(${R(sR*br*.7)},${R(sG*br*.7)},${R(sB*br*.7)})`);
    // Damask pattern
    const p2d=projPoly(front);if(p2d&&sh>.12){const cx2=(p2d[0][0]+p2d[1][0])/2,cy2=(p2d[0][1]+p2d[2][1])/2,scl=Math.max(2,Math.abs(p2d[1][0]-p2d[0][0])*.16);ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='rgba(255,235,155,0.9)';ctx.lineWidth=.7;for(let i=-2;i<=2;i++)for(let j=0;j<=1;j++){ctx.beginPath();ctx.arc(cx2+i*scl*.65,cy2+j*scl*.55-scl*.27,scl*.14,0,Math.PI*2);ctx.stroke();}ctx.restore();}
    strokePts(p2d,`rgba(${R(sR*.6)},${R(sG*.5)},${R(sB*.3)},${.4*br})`,0.8);
  }

  // ── Brocade strip ──
  function strip3D(ty){
    fillQuad([[-sw/2,ty,ZFR],[sw/2,ty,ZFR],[sw/2,ty+stripH,ZFR],[-sw/2,ty+stripH,ZFR]],`rgb(${R(stR*br)},${R(stG*br)},${R(stB*br)})`);
    fillQuad([[-sw/2,ty,ZB],[sw/2,ty,ZB],[sw/2,ty,ZFR],[-sw/2,ty,ZFR]],`rgb(${R(stR*br*1.12)},${R(stG*br*1.12)},${R(stB*br*1.12)})`);
    fillQuad([[-sw/2,ty+stripH,ZFR],[sw/2,ty+stripH,ZFR],[sw/2,ty+stripH,ZB],[-sw/2,ty+stripH,ZB]],`rgb(${R(stR*br*.65)},${R(stG*br*.65)},${R(stB*br*.65)})`);
  }

  // ── Painting area (textured paper + coloured + art) ──
  function painting3D(ty,ph){
    const pts=[[-sw/2,ty,ZFR],[sw/2,ty,ZFR],[sw/2,ty+ph,ZFR],[-sw/2,ty+ph,ZFR]];
    // Washi paper texture tinted by paper tone setting
    if(txPaper){texQuad(pts,txPaper,`rgba(${R(pR*br)},${R(pG*br)},${R(pB*br)},0.5)`);}
    fillQuad(pts,`rgba(${R(pR*br)},${R(pG*br)},${R(pB*br)},${txPaper?.0:.8})`);
    // Depth edges
    fillQuad([[-sw/2,ty,ZB],[sw/2,ty,ZB],[sw/2,ty,ZFR],[-sw/2,ty,ZFR]],`rgba(${R(pR*br*.82)},${R(pG*br*.82)},${R(pB*br*.82)},${.6*br})`);
    fillQuad([[-sw/2,ty+ph,ZFR],[sw/2,ty+ph,ZFR],[sw/2,ty+ph,ZB],[-sw/2,ty+ph,ZB]],`rgba(${R(pR*br*.65)},${R(pG*br*.65)},${R(pB*br*.65)},${.45*br})`);
    // Art + shadows
    clipDraw(pts,p2d=>{
      if(!p2d)return;
      const xs=p2d.map(q=>q[0]),ys=p2d.map(q=>q[1]);
      const x0s=Math.min(...xs),y0s=Math.min(...ys),x1s=Math.max(...xs),y1s=Math.max(...ys);
      const gl=ctx.createLinearGradient(x0s,0,x0s+10,0);gl.addColorStop(0,'rgba(0,0,0,0.1)');gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.fillRect(x0s,y0s,10,y1s-y0s);
      const gr=ctx.createLinearGradient(x1s,0,x1s-10,0);gr.addColorStop(0,'rgba(0,0,0,0.1)');gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(x1s-10,y0s,10,y1s-y0s);
      const gt=ctx.createLinearGradient(0,y0s,0,y0s+10);gt.addColorStop(0,'rgba(0,0,0,0.08)');gt.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gt;ctx.fillRect(x0s,y0s,x1s-x0s,10);
      ctx.save();ctx.globalAlpha=artAlpha;ARTS[curArt].fn(ctx,x0s,y0s,x1s-x0s,y1s-y0s);ctx.restore();
    });
    strokePts(projPoly(pts),'rgba(80,60,22,0.28)',1);
  }

  // Draw top → bottom
  roller3D(yTop,false);
  let y=yTop+rH;
  silk3D(y,mountT); y+=mountT;
  painting3D(y,paintH); y+=paintH;
  strip3D(y); y+=stripH;
  silk3D(y,mountB); y+=mountB;
  roller3D(rollerB,true);
}

// ════════════════════════════════════════
//  ART PAINTINGS
// ════════════════════════════════════════
function seal(c,fx,fy,fw,fh,k){const ss=fw*.062,sx=fx+fw*.76,sy=fy+fh*.86;c.fillStyle='rgba(165,32,22,0.9)';c.fillRect(sx,sy,ss,ss*1.1);c.fillStyle='rgba(244,232,210,0.95)';c.font=`${ss*.66}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(k,sx+ss/2,sy+ss*.55);}
function aEnso(c,fx,fy,fw,fh){const cx=fx+fw*.5,cy=fy+fh*.44,r=fw*.34;c.save();c.lineCap='round';c.lineJoin='round';const sw2=fw*.09;c.lineWidth=sw2;c.strokeStyle='#1c2618';c.beginPath();c.arc(cx,cy,r,Math.PI*.5,Math.PI*2.38);c.stroke();c.lineWidth=sw2*.55;c.beginPath();c.moveTo(cx+r*Math.cos(Math.PI*2.38),cy+r*Math.sin(Math.PI*2.38));c.quadraticCurveTo(cx+r*1.08*Math.cos(Math.PI*2.55),cy+r*1.08*Math.sin(Math.PI*2.55),cx+r*.78*Math.cos(Math.PI*2.72),cy+r*.78*Math.sin(Math.PI*2.72));c.stroke();c.globalAlpha=.1;c.lineWidth=sw2*1.35;c.setLineDash([fw*.018,fw*.004]);c.beginPath();c.arc(cx,cy,r,Math.PI*.5,Math.PI*2.3);c.stroke();c.setLineDash([]);c.restore();seal(c,fx,fy,fw,fh,'間');}
function aFuji(c,fx,fy,fw,fh){const sg=c.createLinearGradient(fx,fy,fx,fy+fh*.55);sg.addColorStop(0,'rgba(152,172,196,0.45)');sg.addColorStop(1,'rgba(202,185,158,0.15)');c.fillStyle=sg;c.fillRect(fx,fy,fw,fh*.6);c.save();c.globalAlpha=.45;c.beginPath();c.arc(fx+fw*.72,fy+fh*.16,fw*.052,0,Math.PI*2);c.fillStyle='rgba(202,182,122,0.7)';c.fill();c.restore();const fcx=fx+fw*.5,fb=fy+fh*.7,fW=fw*.6,fH=fh*.47;const fg=c.createLinearGradient(fcx,fb-fH,fcx,fb);fg.addColorStop(0,'rgba(30,30,40,0.88)');fg.addColorStop(1,'rgba(20,15,10,0.92)');c.fillStyle=fg;c.beginPath();c.moveTo(fcx,fb-fH);c.bezierCurveTo(fcx-fW*.11,fb-fH*.7,fcx-fW*.34,fb-fH*.28,fcx-fW/2,fb);c.lineTo(fcx+fW/2,fb);c.bezierCurveTo(fcx+fW*.34,fb-fH*.28,fcx+fW*.11,fb-fH*.7,fcx,fb-fH);c.closePath();c.fill();c.fillStyle='rgba(232,225,212,0.92)';c.beginPath();c.moveTo(fcx,fb-fH);c.bezierCurveTo(fcx-fW*.04,fb-fH*.84,fcx-fW*.1,fb-fH*.76,fcx-fW*.14,fb-fH*.7);c.bezierCurveTo(fcx-fW*.04,fb-fH*.73,fcx+fW*.04,fb-fH*.73,fcx+fW*.14,fb-fH*.7);c.bezierCurveTo(fcx+fW*.1,fb-fH*.76,fcx+fW*.04,fb-fH*.84,fcx,fb-fH);c.closePath();c.fill();c.save();c.globalAlpha=.28;c.fillStyle='#e2d9c2';c.beginPath();c.ellipse(fcx,fb-fH*.44,fW*.5,fH*.065,0,0,Math.PI*2);c.fill();c.restore();for(let i=0;i<5;i++){const tx2=fx+fw*(.05+i*.22),ty2=fy+fh*(.72+(i%2)*.04),th2=fh*(.17-i%2*.03),tw2=th2*.27;c.fillStyle='rgba(14,10,5,.92)';c.fillRect(tx2-tw2*.14,ty2,tw2*.28,th2*.38);for(let l=0;l<4;l++){c.beginPath();c.moveTo(tx2,ty2+th2*(.04+l*.22));c.lineTo(tx2-tw2*(.48+l*.14),ty2+th2*(.2+l*.22));c.lineTo(tx2+tw2*(.48+l*.14),ty2+th2*(.2+l*.22));c.closePath();c.fillStyle=`rgba(14,10,5,${.85+l*.04})`;c.fill();}}const gg=c.createLinearGradient(fx,fy+fh*.82,fx,fy+fh);gg.addColorStop(0,'rgba(33,24,8,0.72)');gg.addColorStop(1,'rgba(22,15,4,.95)');c.fillStyle=gg;c.beginPath();c.moveTo(fx,fy+fh*.84);c.bezierCurveTo(fx+fw*.2,fy+fh*.8,fx+fw*.5,fy+fh*.83,fx+fw*.8,fy+fh*.8);c.bezierCurveTo(fx+fw*.9,fy+fh*.79,fx+fw,fy+fh*.82,fx+fw,fy+fh*.84);c.lineTo(fx+fw,fy+fh);c.lineTo(fx,fy+fh);c.closePath();c.fill();seal(c,fx,fy,fw,fh,'富');}
function aBamboo(c,fx,fy,fw,fh){const sg=c.createLinearGradient(fx,fy,fx,fy+fh);sg.addColorStop(0,'rgba(168,192,162,0.3)');sg.addColorStop(1,'rgba(132,155,112,0.1)');c.fillStyle=sg;c.fillRect(fx,fy,fw,fh);[.15,.28,.46,.61,.76].forEach((sx2,i)=>{const x=fx+fw*sx2,w2=fw*(.022-.003*i);const sg2=c.createLinearGradient(x-w2,0,x+w2,0);sg2.addColorStop(0,'rgba(52,72,34,0.88)');sg2.addColorStop(.4,'rgba(72,95,48,0.92)');sg2.addColorStop(1,'rgba(42,60,26,0.88)');c.fillStyle=sg2;c.fillRect(x-w2,fy,w2*2,fh);for(let n=0;n<8;n++){const ny=fy+fh*(.1+n*.12);c.fillStyle='rgba(32,52,18,0.72)';c.fillRect(x-w2*1.3,ny-1.5,w2*2.6,3);}if(i%2===0){c.save();c.translate(x,fy+fh*.3);c.rotate(-.4+i*.15);c.beginPath();c.ellipse(fw*.06,0,fw*.12,fw*.02,0,0,Math.PI*2);c.fillStyle='rgba(62,85,38,0.82)';c.fill();c.restore();}});c.save();c.globalAlpha=.16;const mg=c.createLinearGradient(fx,fy+fh*.52,fx,fy+fh*.67);mg.addColorStop(0,'rgba(212,218,202,0)');mg.addColorStop(.5,'rgba(212,218,202,1)');mg.addColorStop(1,'rgba(212,218,202,0)');c.fillStyle=mg;c.fillRect(fx,fy+fh*.52,fw,fh*.15);c.restore();seal(c,fx,fy,fw,fh,'竹');}
function aCherry(c,fx,fy,fw,fh){const sg=c.createLinearGradient(fx,fy,fx,fy+fh);sg.addColorStop(0,'rgba(192,175,202,0.42)');sg.addColorStop(.5,'rgba(215,195,185,0.22)');sg.addColorStop(1,'rgba(172,152,132,0.15)');c.fillStyle=sg;c.fillRect(fx,fy,fw,fh);c.save();c.strokeStyle='rgba(38,22,12,0.88)';c.lineWidth=fw*.038;c.lineCap='round';c.beginPath();c.moveTo(fx+fw*.42,fy+fh);c.bezierCurveTo(fx+fw*.44,fy+fh*.7,fx+fw*.38,fy+fh*.45,fx+fw*.4,fy+fh*.28);c.stroke();c.lineWidth=fw*.02;c.beginPath();c.moveTo(fx+fw*.4,fy+fh*.4);c.bezierCurveTo(fx+fw*.2,fy+fh*.3,fx+fw*.08,fy+fh*.2,fx+fw*.05,fy+fh*.1);c.stroke();c.beginPath();c.moveTo(fx+fw*.42,fy+fh*.45);c.bezierCurveTo(fx+fw*.62,fy+fh*.32,fx+fw*.78,fy+fh*.25,fx+fw*.9,fy+fh*.18);c.stroke();c.restore();[[.12,.22,fw*.16],[.32,.18,fw*.2],[.55,.15,fw*.18],[.78,.22,fw*.14],[.5,.35,fw*.12],[.22,.38,fw*.1]].forEach(([bx,by,br2])=>{for(let p=0;p<22;p++){const px2=fx+fw*bx+(Math.random()-.5)*br2*2,py2=fy+fh*by+(Math.random()-.5)*br2*1.5,ps=fw*(.007+Math.random()*.017);c.save();c.globalAlpha=.48+Math.random()*.38;c.fillStyle=Math.random()>.5?'rgba(212,152,165,0.9)':'rgba(225,175,185,0.88)';c.beginPath();c.arc(px2,py2,ps,0,Math.PI*2);c.fill();c.restore();}});seal(c,fx,fy,fw,fh,'花');}
function aKoi(c,fx,fy,fw,fh){const wg=c.createLinearGradient(fx,fy,fx,fy+fh);wg.addColorStop(0,'rgba(52,82,102,0.52)');wg.addColorStop(.5,'rgba(32,65,85,0.62)');wg.addColorStop(1,'rgba(15,45,65,0.68)');c.fillStyle=wg;c.fillRect(fx,fy,fw,fh);[[.3,.65,.06],[.65,.45,.05],[.18,.4,.04]].forEach(([lx,ly,lr])=>{c.fillStyle='rgba(48,82,38,0.77)';c.beginPath();c.moveTo(fx+fw*lx,fy+fh*ly);c.arc(fx+fw*lx,fy+fh*ly,fw*lr,Math.PI*.15,Math.PI*1.88);c.closePath();c.fill();});function koi(kx,ky,ks,c1,c2){c.save();c.translate(fx+fw*kx,fy+fh*ky);c.save();c.scale(ks,ks*.55);c.beginPath();c.ellipse(0,0,fw*.14,fw*.055,0,0,Math.PI*2);const bg=c.createRadialGradient(0,0,0,0,0,fw*.14);bg.addColorStop(0,c1);bg.addColorStop(1,c2);c.fillStyle=bg;c.fill();c.beginPath();c.moveTo(-fw*.14,0);c.bezierCurveTo(-fw*.2,-fw*.08,-fw*.24,fw*.04,-fw*.18,0);c.fillStyle=c2;c.fill();c.restore();c.restore();}koi(.38,.35,.9,'rgba(212,72,22,0.9)','rgba(172,32,12,0.7)');koi(.6,.7,.75,'rgba(232,192,72,0.9)','rgba(192,142,22,0.7)');koi(.22,.6,.65,'rgba(232,232,225,0.9)','rgba(172,172,165,0.7)');seal(c,fx,fy,fw,fh,'鯉');}
function aCranes(c,fx,fy,fw,fh){const sg=c.createLinearGradient(fx,fy,fx+fw,fy+fh);sg.addColorStop(0,'rgba(192,208,218,0.42)');sg.addColorStop(1,'rgba(175,162,135,0.2)');c.fillStyle=sg;c.fillRect(fx,fy,fw,fh);c.save();c.globalAlpha=.46;c.beginPath();c.arc(fx+fw*.5,fy+fh*.25,fw*.09,0,Math.PI*2);c.fillStyle='rgba(232,195,122,0.67)';c.fill();c.restore();function crane(cx2,cy2,s,fly){c.save();c.translate(fx+fw*cx2,fy+fh*cy2);c.save();c.scale(s,s*.7);c.beginPath();c.ellipse(0,0,fw*.1,fw*.04,fly?-.15:.1,0,Math.PI*2);c.fillStyle='rgba(240,236,230,0.95)';c.fill();c.beginPath();c.moveTo(-fw*.06,0);c.bezierCurveTo(-fw*.15,fly?-fw*.1:-fw*.04,fw*.05,fly?-fw*.08:-fw*.02,fw*.1,-fw*.01);c.closePath();c.fillStyle='rgba(226,222,215,0.88)';c.fill();c.beginPath();c.moveTo(-fw*.06,0);c.bezierCurveTo(-fw*.15,fly?fw*.08:fw*.03,fw*.05,fly?fw*.06:fw*.015,fw*.1,fw*.01);c.closePath();c.fill();c.fillStyle='rgba(8,6,4,0.82)';c.beginPath();c.ellipse(fw*.08,fly?-fw*.07:-fw*.02,fw*.03,fw*.012,.4,0,Math.PI*2);c.fill();c.restore();c.strokeStyle='rgba(230,226,220,0.92)';c.lineWidth=fw*.024;c.lineCap='round';c.beginPath();c.moveTo(fw*.08*s,0);c.bezierCurveTo(fw*.12*s,-fw*.06*s,fw*.14*s,-fw*.12*s,fw*.12*s,-fw*.16*s);c.stroke();c.beginPath();c.arc(fw*.12*s,-fw*.18*s,Math.max(.5,fw*.018*s),0,Math.PI*2);c.fillStyle='rgba(230,226,220,0.95)';c.fill();c.beginPath();c.ellipse(fw*.125*s,-fw*.2*s,Math.max(.5,fw*.012*s),Math.max(.5,fw*.006*s),0,0,Math.PI*2);c.fillStyle='rgba(192,34,24,0.88)';c.fill();c.restore();}crane(.45,.38,.9,true);crane(.68,.28,.75,true);crane(.25,.62,.8,false);seal(c,fx,fy,fw,fh,'鶴');}

// ── ART SWITCHER ──
const ARTS=[{t:'Enso',m:'Sumi Ink on Washi · 2024',p:'From $120',fn:aEnso},{t:'Mount Fuji',m:'Woodblock · 2023',p:'From $95',fn:aFuji},{t:'Bamboo Grove',m:'Ink on Washi · 2024',p:'From $78',fn:aBamboo},{t:'Cherry Blossom',m:'Watercolour · 2023',p:'From $88',fn:aCherry},{t:'Koi Fish',m:'Ink & Colour · 2024',p:'From $105',fn:aKoi},{t:'Cranes',m:'Sumi-e · 2024',p:'From $92',fn:aCranes}];
let curArt=0,artAlpha=1,artFading=false;

function buildPicker(){
  const el=document.getElementById('picker');
  ARTS.forEach((a,i)=>{
    const wrap=document.createElement('div');wrap.className='th'+(i===0?' on':'');
    const tc=document.createElement('canvas');tc.width=58;tc.height=75;
    const tc2=tc.getContext('2d');tc2.fillStyle='#ede0c8';tc2.fillRect(0,0,58,75);a.fn(tc2,0,0,58,75);
    const sp2=document.createElement('span');sp2.textContent=a.t;
    wrap.appendChild(tc);wrap.appendChild(sp2);
    wrap.onclick=()=>{if(i===curArt)return;curArt=i;artAlpha=0;artFading=true;document.querySelectorAll('.th').forEach((t,j)=>t.classList.toggle('on',j===i));document.getElementById('iT').textContent=a.t;document.getElementById('iM').textContent=a.m;document.getElementById('iP').textContent=a.p;};
    el.appendChild(wrap);
  });
}

let infoOn=false;
function updateInfo(){const show=camFOV>1050;if(show!==infoOn){infoOn=show;document.getElementById('info').classList.toggle('show',show);}}

let lastTs=0;
function loop(ts){
  const dt=Math.min((ts-lastTs)/16,3);lastTs=ts;
  camFOV+=(fovT-camFOV)*.12*dt;
  if(artFading){artAlpha=Math.min(1,artAlpha+.05*dt);if(artAlpha>=1)artFading=false;}
  updateInfo();
  try{draw();}catch(e){}
  requestAnimationFrame(loop);
}

buildPicker();
document.getElementById('iT').textContent=ARTS[0].t;
document.getElementById('iM').textContent=ARTS[0].m;
document.getElementById('iP').textContent=ARTS[0].p;
resize();
requestAnimationFrame(loop);
</script>
